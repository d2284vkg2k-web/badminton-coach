    <div class="form-row">
      <div class="form-group combobox"><label class="form-label">学生 <span class="req">*</span></label>
        <input type="text" class="form-input" id="l_student_input" placeholder="输入姓名检索学生…" autocomplete="off" oninput="Forms.lessonStudentSearch()" onfocus="Forms.lessonStudentSearch()" onkeydown="Forms.lessonStudentKey(event)">
        <input type="hidden" id="l_student" value="">
        <div class="combobox-list" id="l_student_list" style="display:none"></div>
      </div>
      <div class="form-group"><label class="form-label">上课日期 <span class="req">*</span></label><input type="date" class="form-input" id="l_date" value="${l ? l.date : (presetDate || Utils.todayStr())}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">开始时间</label><input type="time" class="form-input" id="l_start" value="${l ? l.startTime : '09:00'}" onchange="Forms.lessonCalcDuration()"></div>
      <div class="form-group"><label class="form-label">结束时间</label><input type="time" class="form-input" id="l_end" value="${l ? l.endTime : '10:00'}" onchange="Forms.lessonCalcDuration()"></div>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label class="form-label">课程类型</label>
        <select class="form-select" id="l_type" onchange="Forms.lessonOnTypeChange()">
          <option value="1对1" ${l&&l.type==='1对1'?'selected':''}>1对1</option>
          <option value="1对2" ${l&&l.type==='1对2'?'selected':''}>1对2</option>
          <option value="小班" ${l&&l.type==='小班'?'selected':''}>小班</option>
          <option value="自由定制" ${l&&l.type==='自由定制'?'selected':''}>自由定制</option>
          <option value="大班" ${l&&l.type==='大班'?'selected':''}>大班</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">时长(小时)</label><input class="form-input" id="l_duration" value="${l ? l.duration : 1}" disabled></div>
      <div class="form-group"><label class="form-label">消耗课时</label><input class="form-input" id="l_consume" value="${l ? l.duration : 1}" disabled></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">金额（元）</label><input type="number" class="form-input" id="l_amount" value="${l ? l.amount : 0}" min="0"></div>
      <div class="form-group"><label class="form-label">场地费成本（元）</label><input type="number" class="form-input" id="l_court" value="${l && l.courtCost != null ? l.courtCost : ''}" min="0" placeholder="如：60"></div>
    </div>
    <div class="form-group"><label class="form-label">场地</label><input class="form-input" id="l_location" value="${l ? l.location || '' : ''}" placeholder="如：1号场地"></div>
    <div class="form-group"><label class="form-label">扣减课时包 <span style="font-weight:400;color:var(--gray-500)">（选课包会自动带出课程类型，改类型也会自动匹配同类型课包）</span></label>
      <select class="form-select" id="l_package" onchange="Forms.lessonOnPackageChange()"><option value="">不扣课时</option></select>
      <div class="form-hint" id="pkgInfo" style="font-size:12px;color:var(--gray-500);margin-top:4px"></div>
    </div>
    <div class="form-group"><label class="form-label">备注</label><textarea class="form-textarea" id="l_notes" placeholder="训练内容、表现等">${l ? l.notes || '' : ''}</textarea></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="Forms.lessonSave('${lessonId || ''}')">保存</button>
  `);

  // 初始选中学生时加载课时包
  if (l) {
    const cur = DB.getStudent(l.studentId);
    if (cur) { document.getElementById('l_student').value = l.studentId; document.getElementById('l_student_input').value = cur.name; }
    Forms.lessonOnStudentChange(l.packageId);
  } else if (presetStudentId) {
    const cur = DB.getStudent(presetStudentId);
    if (cur) { document.getElementById('l_student').value = presetStudentId; document.getElementById('l_student_input').value = cur.name; }
    Forms.lessonOnStudentChange();
  }
};
// 学生检索（combobox）
Forms._comboIndex = -1;
Forms.lessonStudentSearch = function() {
  Forms._comboIndex = -1;
  const input = document.getElementById('l_student_input');
  const list = document.getElementById('l_student_list');
  if (!input || !list) return;
  const q = (input.value || '').trim();
  const students = DB.getStudents();
  const filtered = students.filter(s => s.name.indexOf(q) !== -1);
  if (!filtered.length) { list.style.display = 'none'; return; }
  list.innerHTML = filtered.map(s => {
    const remain = Utils.remainingLessons(s);
    const clean = s.name.replace(/'/g, '');
    return `<div class="combobox-item" data-id="${s.id}" data-name="${clean}" onmousedown="Forms.lessonStudentPick('${s.id}','${clean}')"><span class="combobox-name">${s.name}</span><span class="combobox-meta">剩余 ${remain} 节</span></div>`;
  }).join('');
  list.style.display = 'block';
};
Forms.lessonStudentPick = function(id, name) {
  const sidEl = document.getElementById('l_student');
  const inputEl = document.getElementById('l_student_input');
  const listEl = document.getElementById('l_student_list');
  if (!sidEl || !inputEl) return;
  sidEl.value = id;
  inputEl.value = name;
  if (listEl) listEl.style.display = 'none';
  Forms._comboIndex = -1;
  Forms.lessonOnStudentChange();
};
// 键盘导航：↑↓ 选择、Enter 确认、Esc 关闭
Forms.lessonStudentKey = function(e) {
  const list = document.getElementById('l_student_list');
  if (!list) return;
  const items = list.querySelectorAll('.combobox-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (list.style.display === 'none') list.style.display = 'block';
    Forms._comboIndex = Math.min(Forms._comboIndex + 1, items.length - 1);
    Forms._highlightCombo(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    Forms._comboIndex = Math.max(Forms._comboIndex - 1, 0);
    Forms._highlightCombo(items);
  } else if (e.key === 'Enter') {
    if (Forms._comboIndex >= 0 && items[Forms._comboIndex]) {
      e.preventDefault();
      const el = items[Forms._comboIndex];
      Forms.lessonStudentPick(el.dataset.id, el.dataset.name);
    }
  } else if (e.key === 'Escape') {
    list.style.display = 'none';
    Forms._comboIndex = -1;
  }
};
Forms._highlightCombo = function(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === Forms._comboIndex));
  if (items[Forms._comboIndex]) items[Forms._comboIndex].scrollIntoView({ block: 'nearest' });
};
Forms.lessonOnStudentChange = function(currentPkgId) {
  const sid = document.getElementById('l_student').value;
  const pkgSel = document.getElementById('l_package');
  if (!sid) { pkgSel.innerHTML = '<option value="">不扣课时</option>'; document.getElementById('pkgInfo').textContent = ''; return; }
  const s = DB.getStudent(sid);
  const curType = document.getElementById('l_type') ? DB.normalizeType(document.getElementById('l_type').value) : '';
  const allPkgs = s.packages;
  let html = '<option value="">不扣课时</option>';
  let firstActiveId = null, firstTypeMatchId = null;
  allPkgs.forEach(p => {
    const remain = p.totalLessons - p.usedLessons;
    const unit = Math.round(p.price / p.totalLessons);
    const pType = p.type || DB.normalizeType(p.name);
    const disabled = p.status !== 'active' || remain <= 0 ? 'disabled' : '';
    const sel = currentPkgId === p.id ? 'selected' : '';
    if (!currentPkgId) {
      if (!firstActiveId && p.status === 'active' && remain > 0) firstActiveId = p.id;
      if (!firstTypeMatchId && curType && pType === curType && p.status === 'active' && remain > 0) firstTypeMatchId = p.id;
    }
    html += `<option value="${p.id}" ${disabled} ${sel}>${p.name}【${pType} · ${p.lessonDuration||1}h/节 · 剩${remain} · ¥${unit}】</option>`;
  });
  pkgSel.innerHTML = html;
  // 自动选中：优先当前课包 → 匹配课程类型的课包 → 第一个可用课包
  if (!currentPkgId) {
    if (firstTypeMatchId) pkgSel.value = firstTypeMatchId;
    else if (firstActiveId) pkgSel.value = firstActiveId;
    // 新增排课：根据自动选中的扣课包带出课程类型
    if (pkgSel.value) {
      const sp = s.packages.find(p => p.id === pkgSel.value);
      if (sp) {
        const pType = sp.type || DB.normalizeType(sp.name);
        const typeSel = document.getElementById('l_type');
        if (typeSel && [...typeSel.options].some(o => o.value === pType)) typeSel.value = pType;
      }
    }
  }
  Forms.lessonCalcDuration();
  Forms.lessonCalcAmount();
};
// 切换课程类型时，自动把扣课时包跳到同类型的课包
Forms.lessonOnTypeChange = function() {
  const sid = document.getElementById('l_student').value;
  if (!sid) return;
  const s = DB.getStudent(sid);
  const type = DB.normalizeType(document.getElementById('l_type').value);
  const pkgSel = document.getElementById('l_package');
  const cur = pkgSel.value;
  // 当前选中的已是同类型则不改
  if (cur) {
    const cp = s.packages.find(p => p.id === cur);
    if (cp && (cp.type || DB.normalizeType(cp.name)) === type) { Forms.lessonCalcDuration(); Forms.lessonCalcAmount(); return; }
  }
  const match = s.packages.find(p => p.status === 'active' && (p.totalLessons - p.usedLessons) > 0 && (p.type || DB.normalizeType(p.name)) === type);
  if (match) pkgSel.value = match.id;
  Forms.lessonCalcDuration();
  Forms.lessonCalcAmount();
};
// 选择扣课包时，自动把课程类型带出为该课包的类型（与上面类型→课包互相对应）
Forms.lessonOnPackageChange = function() {
  const sid = document.getElementById('l_student').value;
  const pkgId = document.getElementById('l_package').value;
  const typeSel = document.getElementById('l_type');
  if (sid && pkgId && typeSel) {
    const s = DB.getStudent(sid);
    const pkg = s.packages.find(p => p.id === pkgId);
    if (pkg) {
      const pType = pkg.type || DB.normalizeType(pkg.name);
      if ([...typeSel.options].some(o => o.value === pType)) typeSel.value = pType;
    }
  }
  Forms.lessonCalcDuration();
  Forms.lessonCalcAmount();
};
Forms.lessonCalcDuration = function() {
  const start = document.getElementById('l_start').value;
  const end = document.getElementById('l_end').value;
  const dur = Utils.calcDuration(start, end);
  document.getElementById('l_duration').value = dur;
  // 计算消耗课时
  const sid = document.getElementById('l_student').value;
  const pkgId = document.getElementById('l_package').value;
  let consume = dur;
  if (sid && pkgId) {
    const s = DB.getStudent(sid);
    const pkg = s.packages.find(p => p.id === pkgId);
    if (pkg) consume = DB.calcConsume(dur, pkg.lessonDuration);
  }
  document.getElementById('l_consume').value = consume;
};
Forms.lessonCalcAmount = function() {
  const sid = document.getElementById('l_student').value;
  const pkgId = document.getElementById('l_package').value;
  const info = document.getElementById('pkgInfo');
  if (!sid || !pkgId) { info.textContent = ''; return; }
  const s = DB.getStudent(sid);
  const pkg = s.packages.find(p => p.id === pkgId);
  if (!pkg) { info.textContent = ''; return; }
  const pType = pkg.type || DB.normalizeType(pkg.name);
  info.innerHTML = `课时类型 <b>${pType}</b> · 单节时长 <b>${pkg.lessonDuration}h</b> · 单价 ¥${Math.round(pkg.price/pkg.totalLessons)}/课时`;
  const dur = +document.getElementById('l_duration').value || 1;
  const consume = DB.calcConsume(dur, pkg.lessonDuration);
  document.getElementById('l_consume').value = consume;
  const unit = Math.round(pkg.price / pkg.totalLessons);
  document.getElementById('l_amount').value = Math.round(unit * consume);
};
document.addEventListener('change', (e) => {
  if (e.target.id === 'l_package') { Forms.lessonCalcDuration(); Forms.lessonCalcAmount(); }
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.combobox')) {
    const list = document.getElementById('l_student_list');
    if (list) list.style.display = 'none';
  }
});
Forms.lessonSave = function(lessonId) {
  const sid = document.getElementById('l_student').value;
  if (!sid) { showToast('请选择学生'); return; }
  const s = DB.getStudent(sid);
  const start = document.getElementById('l_start').value;
  const end = document.getElementById('l_end').value;
  const data = {
    studentId: sid,
    studentName: s.name,
    date: document.getElementById('l_date').value,
    startTime: start,
    endTime: end,
    duration: Utils.calcDuration(start, end),
    type: document.getElementById('l_type').value,
    packageId: document.getElementById('l_package').value || null,
    amount: +document.getElementById('l_amount').value || 0,
    location: document.getElementById('l_location').value.trim(),
    courtCost: +document.getElementById('l_court').value || 0,
    notes: document.getElementById('l_notes').value.trim()
  };
  if (lessonId) { DB.updateLesson(lessonId, data); showToast('已更新'); }
  else { DB.addLesson(data); showToast('上课记录已添加'); }
  closeModal();
  Router.render();
};

/* ============================================================
   操作
   ============================================================ */
const Actions = {
  deleteLesson(id) {
    if (confirm('确定删除这条上课记录？删除后会回退已扣课时。')) {
      DB.deleteLesson(id);
      showToast('已删除');
      Router.render();
    }
  },
  deleteStudent(id) {
    const s = DB.getStudent(id);
    if (confirm(`确定删除学生「${s.name}」？\n该学生的所有上课记录也会被删除，此操作不可撤销。`)) {
      DB.deleteStudent(id);
      showToast('已删除');
      Router.go('students');
    }
  },
  deletePackage(studentId, pkgId) {
    if (confirm('确定删除这个课时包？已扣减的课时不会恢复。')) {
      DB.deletePackage(studentId, pkgId);
      showToast('已删除');
      Router.render();
    }
  },
  // 把单个课包的已用课时，按实际上课记录重算对齐（修复小数累积/删改残留导致的偏差）
  calibratePackage(studentId, pkgId) {
    const s = DB.getStudent(studentId);
    const pkg = s && s.packages.find(p => p.id === pkgId);
    if (!pkg) return;
    const lessons = DB.getLessons().filter(l => l.studentId === studentId && l.packageId === pkgId);
    const theo = Math.round(lessons.reduce((sum, l) => sum + DB.calcConsume(l.duration, pkg.lessonDuration), 0) * 10) / 10;
    pkg.usedLessons = Math.min(pkg.totalLessons, theo);
    pkg.status = pkg.usedLessons >= pkg.totalLessons ? 'finished' : 'active';
    DB.save();
    showToast('已校准：' + pkg.name + ' 已用 ' + pkg.usedLessons + ' 节');
    Router.render();
  },
  // 校准该学生全部课包
  calibrateAllPackages(studentId) {
    const s = DB.getStudent(studentId);
    if (!s || !s.packages) return;
    s.packages.forEach(pkg => {
      const lessons = DB.getLessons().filter(l => l.studentId === studentId && l.packageId === pkg.id);
      const theo = Math.round(lessons.reduce((sum, l) => sum + DB.calcConsume(l.duration, pkg.lessonDuration), 0) * 10) / 10;
      pkg.usedLessons = Math.min(pkg.totalLessons, theo);
      pkg.status = pkg.usedLessons >= pkg.totalLessons ? 'finished' : 'active';
    });
    DB.save();
    showToast('已全部校准');
    Router.render();
  },
  deletePlan(studentId, planId) {
    if (confirm('确定删除这个训练计划？')) {
      DB.deletePlan(studentId, planId);
      showToast('已删除');
      Router.render();
    }
  },
  exportData() {
    const data = DB.exportData();
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `羽毛球教练数据备份_${Utils.todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('已导出');
  },
  importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        DB.importData(e.target.result);
        showToast('导入成功');
        Router.render();
      } catch (err) {
        showToast('导入失败：' + err.message);
      }
    };
    reader.readAsText(file);
  },
  resetData() {
    if (confirm('确定清空所有数据并恢复到内置备份数据（13个学生、73条课程）？\n此操作不可撤销！')) {
      localStorage.removeItem(DB.KEY);
      DB.init();
      showToast('已重置为备份数据');
      Router.go('dashboard');
    }
  }
};

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) Actions.importData(e.target.files[0]);
  e.target.value = '';
});

/* ============================================================
   初始化
   ============================================================ */
DB.init();

// 导航事件
document.querySelectorAll('.nav-item').forEach(n => {
  n.addEventListener('click', () => Router.go(n.dataset.page));
});

// 移动端菜单
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

// 渲染首页
Router.render();
</script>
</body>
